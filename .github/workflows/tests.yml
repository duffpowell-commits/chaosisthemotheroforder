name: tests

# Runs on every push and PR so a broken build shows a red X on GitHub,
# whichever Claude session (or Duff) pushed it.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.5
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import assets
        run: godot --headless --path . --import

      - name: Parse every script
        # A parse error makes a scene hang instead of failing, so check them all.
        run: |
          fail=0
          for f in $(git ls-files '*.gd'); do
            if godot --headless --path . --check-only --script "$f" 2>&1 | grep -E "Parse Error|SCRIPT ERROR"; then
              echo "::error file=$f::parse error"; fail=1
            fi
          done
          exit $fail

      - name: Unit tests
        run: godot --headless --path . --script tests/run_tests.gd

      - name: Run -> mission -> run flow
        run: godot --headless --path . --script tools/mission_flow_check.gd

  art-qa:
    # Automated art checks (tools/art_qa.py): readable text via OCR, palette
    # rules, sizes, sprite alpha and edges. Rules and logged exceptions are in
    # tools/art_qa.json.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract and Python deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
          python -m pip install --quiet pillow numpy pytesseract

      - name: Art QA self-test (catches synthetic text and off-palette art)
        env:
          ART_QA_REQUIRE_OCR: "1"
        run: python tools/test_art_qa.py

      - name: Art QA on the repo's art
        run: python tools/art_qa.py --require-ocr
